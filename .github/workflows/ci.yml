name: CI

# Corre sempre: em cada push (qualquer branch) e em cada Pull Request.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Lint · Build · Testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm db:generate

      - name: Build (shared + api + web + admin)
        run: pnpm build

      # O ESLint ainda não está configurado neste repositório (falta a
      # dependência e a config). Corre à mesma, mas não bloqueia o CI.
      - name: Lint
        continue-on-error: true
        run: pnpm lint

      - name: Testes (API)
        run: pnpm test
